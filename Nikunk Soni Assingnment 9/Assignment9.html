<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            width: 800px;
            background-color:rgb(0, 139, 19);
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: rgb(31, 125, 161);
        }
        .box1{
            height: 60%;
            width: 65%;
            background-color: rgb(129, 8, 113);
            border: 20px solid rgb(193, 224, 18);
            margin: 20px 20px 20px 40px;
            padding: 55px 20px 20px 80px;
        }
        .box2{
            height: 80%;
            width: 80%;
            text-align: center;
            line-height: 190px;
            background-color: rgb(41, 228, 172);
        }
        .margin{
            position: absolute;
            top: 114px;
            left: 50%;
        }
        .border{
            position: absolute;
            top: 135px;
            left: 650px;
            color: white;
        }
        .padding{
            position: absolute;
            top:170px;
            left: 650px;
            color: white;
        }
        
    </style>
</head>
<body>
    <h1 align="center"> Box Plotting</h1>
    <div class="con">
        <div class="box">
            <p class="margin">Margin</p>
            <div class="box1">
                <p class="border">Border</p>
                <p class="padding">Padding</p>
                <div class="box2">
                    <p >Content</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
